bot:
  automerge: true
conda_build:
  pkg_format: '2'
conda_forge_output_validation: true
github:
  branch_name: main
  tooling_branch_name: main
os_version:
  linux_64: cos7
test: native_and_emulated
workflow_settings:
  free_disk_space: quick
  pagefile_size:
    - os: linux
      value: 20
provider:
  linux_aarch64: default
  osx_arm64: default
