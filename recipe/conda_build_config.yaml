c_stdlib_version:   # [linux]
  - "2.17"          # [linux]

# The vendored tree-sitter build dependency uses std::basic_string<unsigned short>,
# which libc++ 19+ no longer supports (generic std::char_traits was removed).
c_compiler_version:    # [osx]
  - "18"               # [osx]
cxx_compiler_version:  # [osx]
  - "18"               # [osx]
